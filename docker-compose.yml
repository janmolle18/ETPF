services:
  db:
    image: postgres:16-alpine
    container_name: etpf-postgres
    restart: always
    environment:
      POSTGRES_DB: etpf
      POSTGRES_USER: etpf_user
      POSTGRES_PASSWORD: etpf_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
